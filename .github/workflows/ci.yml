name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  database-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/database_rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/database_rules/package-lock.json
      - run: npm ci
      - run: npm test
