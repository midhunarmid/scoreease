name: scoreease
description: Keep score of anything. Offline first, live when you share.
publish_to: 'none'
version: 2.0.0+7

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  google_fonts: ^8.1.0
  go_router: ^18.1.1
  url_launcher: ^6.1.12
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  collection: ^1.19.1
  firebase_core: ^3.15.1
  firebase_database: ^11.0.2
  firebase_auth: ^5.7.0
  package_info_plus: ^8.3.0
  flutter_animate: ^4.5.2
  share_plus: ^12.0.2
  crypto: ^3.0.7
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.3.3
  file_picker: ^11.0.3
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
